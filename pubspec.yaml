name: abs_onlinestore
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ✅ UI & Animation Packages
  animated_splash_screen: ^1.3.0
  page_transition: ^2.0.9
  google_fonts: ^6.1.0

  # ✅ Hive (Local Storage)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.15

  # ✅ Dependency Injection (Service Locator)
  get_it: ^7.6.4
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ✅ Hive Code Generation
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/image/
